<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|[MKT] ${title}|">Marketing Site</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f5f6fa; }
        .sidebar { min-height: 100vh; background: #1f2937; }
        .sidebar .nav-link { color: #cbd5e1; border-radius: .375rem; }
        .sidebar .nav-link:hover { background: #374151; color: #fff; }
        .sidebar .nav-link.active { background: #2563eb; color: #fff; }
        .table thead th { white-space: nowrap; }
        .sort-link { color: inherit; text-decoration: none; }
        .sort-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <nav class="col-12 col-md-3 col-lg-2 sidebar p-3">
            <h5 class="text-white mb-1">OnlineShop</h5>
            <p class="text-secondary small mb-4">Marketing Site</p>
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/mkt/products}"
                       th:classappend="${activeMenu == 'products'} ? 'active'">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/mkt/customers}"
                       th:classappend="${activeMenu == 'customers'} ? 'active'">Customers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/mkt/feedbacks}"
                       th:classappend="${activeMenu == 'feedbacks'} ? 'active'">Feedbacks</a>
                </li>
            </ul>
        </nav>

        <main class="col-12 col-md-9 col-lg-10 py-4 px-4">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <th:block th:replace="${content}">Noi dung trang</th:block>
        </main>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
