<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout('Product Details', ~{::section})}" lang="vi">
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" th:text="${product.id == null} ? 'Add new product' : 'Product Details'">
            Product Details
        </h4>
        <a class="btn btn-outline-secondary" th:href="@{/mkt/products}">&larr; Quay lai danh sach</a>
    </div>

    <form method="post" th:action="@{/mkt/products/save}" th:object="${product}">
        <input type="hidden" th:field="*{id}">

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
        </div>

        <div class="row g-3">
            <div class="col-lg-8">
                <div class="card card-body">

                    <div class="mb-3">
                        <label class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{title}"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{title}"></div>
                        <div class="form-text" th:if="${product.slug}">
                            Slug hien tai: <code th:text="${product.slug}"></code>
                            (tu sinh lai theo title khi luu)
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Brief info</label>
                        <textarea class="form-control" rows="2" th:field="*{briefInfo}"
                                  th:classappend="${#fields.hasErrors('briefInfo')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback" th:errors="*{briefInfo}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="6" th:field="*{description}"></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label">Thumbnail URL</label>
                        <input type="text" class="form-control" th:field="*{thumbnail}"
                               placeholder="https://..."
                               th:classappend="${#fields.hasErrors('thumbnail')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{thumbnail}"></div>
                        <div class="form-text">Giai doan nay chua lam upload anh nen chi nhap URL.</div>
                    </div>

                </div>
            </div>

            <div class="col-lg-4">
                <div class="card card-body">

                    <div class="mb-3">
                        <label class="form-label">Category <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{categoryId}"
                                th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                            <option value="">-- Chon category --</option>
                            <option th:each="c : ${categories}"
                                    th:value="${c.id}" th:text="${c.value}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity <span class="text-danger">*</span></label>
                        <input type="number" min="0" class="form-control" th:field="*{quantity}"
                               th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{quantity}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">List price <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0" class="form-control"
                               th:field="*{listPrice}"
                               th:classappend="${#fields.hasErrors('listPrice')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{listPrice}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sale price</label>
                        <input type="number" step="0.01" min="0" class="form-control"
                               th:field="*{salePrice}"
                               th:classappend="${#fields.hasErrors('salePrice')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{salePrice}"></div>
                        <div class="form-text">Khong duoc lon hon list price.</div>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" th:field="*{featured}">
                        <label class="form-check-label">Featured</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{status}"
                                th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                            <option th:each="s : ${statuses}"
                                    th:value="${s}" th:text="${s.label}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{status}"></div>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" type="submit">Luu</button>
                        <a class="btn btn-outline-secondary" th:href="@{/mkt/products}">Huy</a>
                    </div>

                </div>
            </div>
        </div>
    </form>

</section>
</body>
</html>
