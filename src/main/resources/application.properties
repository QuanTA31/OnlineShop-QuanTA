spring.application.name=OnlineShop

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/onlineshop
spring.datasource.username=postgres
spring.datasource.password=@31Quan12
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# data.sql phai chay SAU khi Hibernate tao bang
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Server =====
# Doi port bang bien moi truong SERVER_PORT neu 8080 da bi chiem
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# Hien trang error/404.html thay vi whitelabel
spring.web.resources.add-mappings=true
